<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membership Club</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --text:#eef0f6; --muted:#8b90a3; --accent:#7c6cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:20px; }
  main { width:100%; max-width:460px; background:var(--card); border-radius:16px; padding:28px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
  button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; margin-top:12px; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { margin-top:14px; font-size:.9rem; color:var(--muted); word-break:break-all; }
  #status.err { color:var(--err); }
  #vault { margin-top:18px; padding:18px; border:1px solid var(--ok); border-radius:12px; }
  #vault h2 { margin:0 0 8px; color:var(--ok); font-size:1.1rem; }
  #vault p { margin:0; color:var(--text); line-height:1.5; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Membership Club</h1>
  <p class="sub">Sepolia testnet &middot; <span id="price">…</span> ETH to join</p>

  <button id="connect">Connect wallet</button>
  <button id="join" hidden>Join the club</button>
  <div id="status"></div>

  <section id="vault" hidden>
    <h2>Members only</h2>
    <p>Welcome in. This section renders only because <code>isMember()</code> returned true for your wallet. Replace this text with your gated content.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script>
const CONTRACT = "0xF5Ac6e16A620db314463F7fB9C707E9c070C2120";
const SEPOLIA_HEX = "0xaa36a7";
const ABI = [
  "function isMember(address) view returns (bool)",
  "function mintPrice() view returns (uint256)",
  "function join() payable"
];

const $ = (id) => document.getElementById(id);
let signer, account, contract;

function say(msg, isErr) {
  $("status").textContent = msg;
  $("status").className = isErr ? "err" : "";
}

async function connect() {
  if (!window.ethereum) return say("No wallet found. Install MetaMask.", true);
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    try {
      await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: SEPOLIA_HEX }] });
    } catch (e) {
      return say("Please switch your wallet to the Sepolia network.", true);
    }
    const provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    account = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT, ABI, signer);
    $("price").textContent = ethers.formatEther(await contract.mintPrice());
    $("connect").hidden = true;
    await refresh();
  } catch (e) {
    say(e.shortMessage || e.message, true);
  }
}

async function refresh() {
  const member = await contract.isMember(account);
  $("vault").hidden = !member;
  $("join").hidden = member;
  say(member ? "Connected: " + account : "Connected: " + account + " (not a member yet)");
}

async function join() {
  $("join").disabled = true;
  try {
    say("Confirm the transaction in your wallet…");
    const tx = await contract.join({ value: await contract.mintPrice() });
    say("Waiting for confirmation…");
    await tx.wait();
    await refresh();
  } catch (e) {
    say(e.reason || e.shortMessage || e.message, true);
  }
  $("join").disabled = false;
}

$("connect").addEventListener("click", connect);
$("join").addEventListener("click", join);
if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => location.reload());
  window.ethereum.on("chainChanged", () => location.reload());
}
</script>
</body>
</html>
